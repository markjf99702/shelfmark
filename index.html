:root{
  --ground:#F5EFE3;--surface:#FFFCF6;--surface2:#F0E8DA;--sunk:#EAE1D1;
  --ink:#241E18;--ink2:#5C5247;--ink3:#706558;--line:#E3D9C7;--line2:#CDBFA9;
  --accent:#8C2F24;--accent-ink:#FFF8EE;--accent-soft:#F4DDD5;
  --green:#2E5E48;--green-soft:#DDEBE2;
  --brass:#86591A;--brass-soft:#F4E6C6;
  --bad:#A8321C;--bad-soft:#F7DCD4;
  --rule:#D9A79B;
  /* behind a sheet, and round its edge (the light page's shadow is enough; a dark page needs a line) */
  --scrim:rgba(20,14,8,.45);--edge:transparent;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
  --shadow:0 1px 0 rgba(36,30,24,.04),0 8px 22px -16px rgba(36,30,24,.4);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#15120E;--surface:#1F1A15;--surface2:#28221B;--sunk:#110E0B;
  --ink:#F2EADD;--ink2:#BFB3A2;--ink3:#968C7D;--line:#30291F;--line2:#463C30;
  --accent:#E8907A;--accent-ink:#1A100C;--accent-soft:#3F2019;
  --green:#8ACBA9;--green-soft:#17291F;
  --brass:#DDB56B;--brass-soft:#352A14;
  --bad:#F28E74;--bad-soft:#401D15;
  --rule:#6A3A30;
  --scrim:rgba(0,0,0,.62);--edge:#4A3F33;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#15120E;--surface:#1F1A15;--surface2:#28221B;--sunk:#110E0B;
  --ink:#F2EADD;--ink2:#BFB3A2;--ink3:#968C7D;--line:#30291F;--line2:#463C30;
  --accent:#E8907A;--accent-ink:#1A100C;--accent-soft:#3F2019;
  --green:#8ACBA9;--green-soft:#17291F;
  --brass:#DDB56B;--brass-soft:#352A14;
  --bad:#F28E74;--bad-soft:#401D15;
  --rule:#6A3A30;
  --scrim:rgba(0,0,0,.62);--edge:#4A3F33;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -16px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* the keyboard's focus is scrolled clear of the sticky top bar (and, on a phone, of the + button below) */
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 var(--sans);min-height:100vh}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* A hover look shows only where something can hover (a mouse): on a touch screen a tap would leave it behind, on a mood
   tapped off, say (CSS Media Queries Level 4, 7.2, the hover feature). A tap shows as a quiet pressed look instead
   (below the buttons), not the browser's own grey-blue box. */
button,a,summary,label,select{-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.5}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-width:0;font-size:16px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.45}
select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
/* a date field as tall as a text field beside it (Chromium pads its inside 1px more; an empty one on an iPhone is shorter) */
input[type=date]{min-height:calc(1.45em + 18px)}
input[type=date]::-webkit-datetime-edit-fields-wrapper{padding:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
/* a field's example words read (4.5:1), and still look like an example beside what's typed */
::placeholder{color:var(--ink3);opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.note{color:var(--ink3);font-size:13.5px;margin:6px 0 0}
/* with viewport-fit=cover, the page keeps clear of an iPhone's notch in landscape itself */
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{display:flex;align-items:center;gap:8px;max-width:1240px;margin:0 auto}
.brand{flex:none;display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font:italic 500 26px/1 var(--serif);letter-spacing:-.01em}
.tbtn{flex:none;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:7px 13px;font:600 13.5px var(--sans);color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
@media (hover:hover){.tbtn:hover{color:var(--ink);border-color:var(--ink3)}}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.tbtn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}}
.sync{border-style:dashed}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.sync[data-s="ok"] i{background:var(--green)}
.sync[data-s="busy"] i{background:var(--brass);animation:pulse 1s ease-in-out infinite}
.sync[data-s="tap"]{border-style:solid;border-color:var(--brass);color:var(--brass)}
.sync[data-s="tap"] i{background:var(--brass)}
.sync[data-s="offline"]{border-color:var(--brass);color:var(--brass)}
.sync[data-s="offline"] i{background:var(--brass)}
.sync[data-s="err"]{border-style:solid;border-color:var(--bad);color:var(--bad)}
.sync[data-s="err"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}

/* search and filters */
.tools{padding:16px 0 6px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3);pointer-events:none}
.search input{padding:11px 12px 11px 40px;border-radius:11px;font-size:16px;background:var(--surface);box-shadow:var(--shadow)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;padding:5px 2px;margin:-3px 0} /* room for a chip's keyboard ring */
.chips::-webkit-scrollbar{display:none}
/* With a mouse (a laptop zoomed in, say) a row that scrolls sideways can't be reached past its edge, so it wraps. */
@media (pointer:fine){.chips{flex-wrap:wrap;overflow:visible}}
/* a row that scrolls sideways fades out at an edge with more chips past it, so it shows that it scrolls */
.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent)}
.fade-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 32px),transparent)}
.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent)}
.chip{flex:none;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font:600 13px var(--sans);color:var(--ink2);white-space:nowrap}
@media (hover:hover){.chip:hover{color:var(--ink);border-color:var(--ink3)}}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
/* a chip's count is quieter than its word, and still reads (WCAG 2.2 SC 1.4.3, 4.5:1); on the chosen chip, it's as clear */
.chip .n{font:500 11.5px var(--mono);color:var(--ink3);margin-left:3px}
.chip[aria-pressed="true"] .n{color:var(--ground)}
.selects{display:flex;gap:6px;flex:0 1 auto;min-width:0}
.selects select{width:auto;max-width:190px;padding:6px 28px 6px 10px;font-size:14px;border-radius:999px}
.count{margin:14px 2px 10px;font:500 12.5px var(--mono);color:var(--ink3);letter-spacing:.02em}
/* the count opens the summary: it reads as it did, with a › after it */
.sumbtn{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-align:left;display:inline-flex;align-items:baseline;gap:7px}
.sumbtn .chev{font:600 15px/1 var(--sans);color:var(--ink3)}
@media (hover:hover){.sumbtn:hover{color:var(--ink)}.sumbtn:hover .chev{color:var(--accent)}}
.chip .x{margin-left:6px;font-weight:500}

/* book list */
.list{--cols:repeat(auto-fill,minmax(340px,1fr));display:grid;grid-template-columns:var(--cols);gap:10px}
/* Sorted by shelf, each shelf is a section across the list: its heading, then its books in the list's columns. The
   heading stays under the top bar while its books go by (--toph is the bar's height, kept by the script), and goes with
   them; its band of the page's colour covers the books going under it. */
.shelf{grid-column:1/-1;min-width:0}
.shelf:first-child{margin-top:-8px}
.shelf+.shelf{margin-top:6px}
.shelf-bks{display:grid;grid-template-columns:var(--cols);gap:10px}
.grp{position:sticky;top:var(--toph,calc(env(safe-area-inset-top,0px) + 55px));z-index:1;background:var(--ground);margin:0;padding:8px 2px 10px;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);overflow:hidden;overflow-wrap:anywhere}
/* In the list a shelf's heading has a Move button at its end, and the two stay under the top bar together. */
.gh{position:sticky;top:var(--toph,calc(env(safe-area-inset-top,0px) + 55px));z-index:1;background:var(--ground);display:flex;align-items:center;gap:10px}
.gh>.grp{position:static;flex:1;min-width:0}
.mvb{flex:none;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font:600 12.5px/18px var(--sans);color:var(--ink2)}
@media (hover:hover){.mvb:hover{color:var(--ink);border-color:var(--ink3)}}
.mvb:active{background:var(--sunk)}
/* the keyboard's book is scrolled clear of the heading too, one of two lines included */
html:has(#list .shelf:not(.now):not(.rest)){scroll-padding-top:calc(var(--toph,calc(env(safe-area-inset-top,0px) + 55px)) + 64px)}
/* The rule runs on from the count to the edge, on the heading's last line when a long one wraps (the count goes with the
   shelf's last word). It takes no room on the line, so it never wraps onto a line of its own; the heading clips the rest. */
.grp::after{content:"";display:inline-block;width:100%;margin-right:-100%;height:1px;vertical-align:middle;background:linear-gradient(to right,transparent 10px,var(--line2) 10px)}
.grp .n{font:500 11.5px var(--sans);letter-spacing:normal;text-transform:none;color:var(--ink3);margin-left:.2em}
/* Reading now, first in the list with no search or filter on: its books, each with Finished and Set aside under it, then
   All books. Their headings scroll away with the list (a shelf's heading stays: there are many). */
.shelf.now .grp,.shelf.rest .grp{position:static}
.nowbk{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.nowbk>.bk{border:0;box-shadow:none;background:none}
.now-acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px 68px;margin-top:-4px}
.bk{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 10px;box-shadow:var(--shadow);width:100%;min-width:0}
@media (hover:hover){.bk:hover{border-color:var(--line2)}}
/* a book just added by hand, tinted a moment where the list was scrolled to show it */
.bk.new{animation:justin 2s ease-in}
@keyframes justin{0%,25%{background:var(--brass-soft);border-color:var(--brass)}}
/* rows out of sight aren't laid out until they come near, so a long list redraws quickly on a slow phone, and
   find-in-page still finds them. Until then a row counts as the height it last had, or as an average row (74px inside
   its padding); render() carries those heights across a redraw and keeps the reader's place. */
.bk{content-visibility:auto;contain-intrinsic-size:auto 74px}
.bk-tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;padding-top:1px}
.bk-t{font:500 17px/1.22 var(--serif);color:var(--ink);overflow-wrap:anywhere}
.bk-t .s{color:var(--ink2);font-weight:400}
.bk-a{color:var(--ink2);font-size:13.5px;overflow-wrap:anywhere}
.bk-m{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;margin-top:5px}
.loc{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.bdg{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 6px;font:600 11.5px var(--sans);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bdg.reading{background:var(--brass-soft);color:var(--brass)}
.bdg.read{background:var(--green-soft);color:var(--green)}
.bdg.aside{background:var(--surface2);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}
.bdg.wanted{border:1px solid var(--brass);color:var(--brass)}
.bdg.lent{background:var(--accent-soft);color:var(--accent)}
.bdg.check{border:1px dashed var(--accent);color:var(--accent)}
.bk-ck{font-size:13px;line-height:1.35;color:var(--accent);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bdg.stars{color:var(--brass);padding:0;font-size:12px;letter-spacing:.5px}

/* covers: a cloth-bound stand-in, with the real cover on top when lookups are on */
.cv{--cloth:#7A2E26;position:relative;flex:none;width:46px;height:68px;border-radius:2px 5px 5px 2px;background:linear-gradient(90deg,rgba(0,0,0,.22) 0 3px,rgba(255,255,255,.08) 3px 5px,transparent 5px),var(--cloth);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 2px 4px -1px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#F4E9D2}
.cv::after{content:"";position:absolute;left:9px;right:6px;top:10px;height:1px;background:rgba(244,233,210,.45);box-shadow:0 3px 0 rgba(244,233,210,.25)}
.cv-t{font:500 17px/1 var(--serif);letter-spacing:.02em;padding-left:3px}
.cv-t.wide{font-size:12px;letter-spacing:0} /* a number of three or four figures ("1984") */
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.cv img.on{opacity:1}
.cv.lg{width:92px;height:136px;border-radius:3px 7px 7px 3px}
.cv.lg::after{top:18px;left:14px;right:10px}
/* the title sits at the top of the cover, five lines at most, the last ending in … (no padding below it, where a
   sixth line would show) */
.cv.lg .cv-t{font-size:13.5px;line-height:1.15;padding:28px 10px 0 14px;align-self:flex-start;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-align:left;width:100%;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}

/* empty states */
.empty{grid-column:1/-1;max-width:560px;margin:28px auto 0;text-align:center;padding:10px}
.empty svg{width:132px;height:auto;margin-bottom:6px}
.empty h2{font:500 28px/1.15 var(--serif);margin:0 0 10px}
.empty p{color:var(--ink2);margin:0 0 14px}
.steps{list-style:none;padding:0;margin:0 auto 20px;text-align:left;display:grid;gap:8px;max-width:440px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;counter-increment:s}
.steps .how{display:block;width:max-content;margin-top:4px;font-size:14px;position:relative}
.steps .how::after{content:"";position:absolute;inset:-12px -4px} /* a tap 44px tall on a phone */
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12px/22px var(--mono);text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty .row{justify-content:center}
.empty .away{margin:24px 0 10px;font-size:14px;color:var(--ink3)}

/* buttons */
.btn{background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:9px 15px;font:600 14.5px var(--sans);color:var(--ink);white-space:nowrap}
@media (hover:hover){.btn:hover{border-color:var(--ink3)}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.06)}}
.btn.quiet{background:none;border-color:transparent;color:var(--ink2)}
@media (hover:hover){.btn.quiet:hover{border-color:var(--line2);color:var(--ink)}}
.btn.danger{color:var(--bad);border-color:transparent;background:none}
@media (hover:hover){.btn.danger:hover{border-color:var(--bad)}}
#stErase{white-space:normal;text-align:left} /* its second-tap words don't fit a phone on one line */
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
/* pressed */
.bk:active,.nx-alt:active{background:var(--surface2)}
.chip:not([aria-pressed="true"]):active,.tagpicks button:not([aria-pressed="true"]):active,.seg button:not([aria-pressed="true"]):active{background:var(--sunk)}
.btn:active,.tbtn:active,.nextbtn:active{filter:brightness(.96)}

/* sheets */
#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--edge),0 30px 80px -20px rgba(0,0,0,.55);overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.hd h2{margin:0;font:500 21px/1.2 var(--serif);flex:1;min-width:0}
#sheetTitle{outline:none} /* focused as a sheet opens; it isn't something to press */
/* On a touch screen, Done, Close and the like answer a tap 44px tall, in a header no taller than before. Only there:
   with a mouse, a box that tall shows as the button's hover border and its keyboard outline. */
@media (pointer:coarse){.hd .btn{min-height:44px;margin:-7px 0}}
.hd .callno{flex:1;min-width:0;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{padding:16px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* a sheet with no footer (Settings, Import) ends clear of an iPhone's home indicator */
.panel>.bd:last-child{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface2)}
.ft .grow{flex:1}
/* An iPad's sheet is a box in the middle of the screen, away from the home indicator: no room kept for it. */
@media (min-width:641px) and (min-height:501px){.panel>.bd:last-child{padding-bottom:16px}.ft{padding-bottom:12px}}
/* On a phone, upright or sideways, a sheet comes up from the bottom; sideways it's no wider than upright, so it stays
   clear of the notch either side. */
@media (max-width:640px),(max-height:500px){
  .panel{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;max-width:640px;margin:0 auto;max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px - env(safe-area-inset-top,0px));border-radius:16px 16px 0 0}
  /* What to read next takes the full height, so its choices don't move under the finger as the result changes */
  .panel.tall{height:calc(100vh - 28px);height:calc(100dvh - 28px - env(safe-area-inset-top,0px))}
  .panel.tall>.bd{flex:1 1 auto}
}

/* the catalog card */
.card-top{display:flex;gap:14px;align-items:flex-start;padding-bottom:14px;margin-bottom:14px;border-bottom:3px double var(--rule)}
.card-tt{flex:1;min-width:0;display:grid;gap:8px}
/* Add a book: a book that's here already says so under Author (out of the way while there's nothing to say) */
#f-dup{margin:-2px 0 0}
#f-notes-n{margin:0}
.kept{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.kept .note{flex:1;margin:0}
#f-dup:empty{position:absolute;margin:0}
/* the title is a box of one line that grows to show a long one whole */
.card-tt .ti{font:500 20px/1.25 var(--serif);padding:6px 8px;min-height:0;resize:none;overflow:hidden;display:block}
.flag{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:9px 11px;margin:0 0 14px;font-size:14px}
.flag span{flex:1;min-width:12em}
.flag.store{margin:16px 0 0}
/* a book on the wishlist, in brass: it isn't a doubt to settle, as Check is */
.flag.want{border-color:var(--brass);background:var(--brass-soft);color:var(--brass)}
.ft .flag{flex-basis:100%;margin:0}
/* on a phone, a footer note of more than a few words takes a row of its own, above the button */
@media (max-width:520px){.ft .note.wide{flex-basis:100%;margin:0}.ft .note.wide~.btn{margin-left:auto}}
/* one column that's never wider than the card, so a long line (the Reading details summary) shrinks to fit instead */
.fs{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.fl{display:grid;gap:4px;min-width:0}
.fl>span:first-child,.lbl{font:600 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;background:var(--surface)}
.seg button{background:none;border:0;padding:7px 14px;font:600 13.5px var(--sans);color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
/* The row's round ends are the end choices' own (the row doesn't cut its choices off, so it doesn't cut off their tap
   boxes either), and the keyboard's ring is drawn inside a choice, clear of its neighbours, with a line of the card's
   colour inside it so it shows on the chosen one too. */
.seg button:first-child{border-radius:999px 0 0 999px}
.seg button:last-child{border-radius:0 999px 999px 0}
.seg button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 4px var(--surface)}
.stat-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
/* the day a book was finished, beside its stars as Since is beside Lent to */
.stat-row .fin{display:flex;align-items:center;gap:8px}
.stat-row .fin input{width:auto}
.stars{display:inline-flex;gap:0}
/* each star answers a tap about 39px square; the negative margins keep them where they were. A star not given is an
   outline as clear as small grey text (WCAG 2.2 SC 1.4.11 asks 3:1 of a control's look), one given is filled in brass. */
.stars button{background:none;border:0;padding:8px;margin:-6px -5px;font-size:23px;line-height:1;color:var(--ink3)}
.stars button.on{color:var(--brass)}
.loan{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:end}
#f-back{justify-self:start}
.tagpicks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tagpicks button{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font:500 12.5px var(--sans);color:var(--ink2)}
@media (hover:hover){.tagpicks button:hover{border-color:var(--ink3);color:var(--ink)}}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:inline-flex;gap:7px;align-items:center;font-size:14.5px}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.more>summary{cursor:pointer;padding:10px 12px;font:600 14px var(--sans);color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more .fs{padding:2px 12px 12px}
.sum-l{flex:none;white-space:nowrap}
.sum-v{margin-left:auto;font:500 12.5px var(--sans);color:var(--ink3);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl>.seg{justify-self:start;max-width:100%}
.tagpicks.picks{margin-top:0;gap:6px}
.tagpicks.picks button{padding:5px 11px;font-size:13px}
.tagpicks button[aria-pressed="true"],#f-genres button{background:var(--ink);border-color:var(--ink);color:var(--ground)}
#f-genre{justify-self:start;width:auto;max-width:100%;padding:5px 28px 5px 10px;font-size:16px;border-radius:999px}
.isbnrow{display:flex;gap:8px}
.isbnrow input{flex:1}

/* import review */
.lede{margin:0 0 12px;color:var(--ink2)}
.lede b{color:var(--ink);font-weight:600}
.bulk{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.bulk .two{margin-top:6px}
.bulk .opt{margin:6px 0 -4px;padding:8px 0;font-size:14.5px}
.rv{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rv li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
.rv li{content-visibility:auto;contain-intrinsic-size:auto 100px}
.rv li.off{background:var(--surface2)}
/* A book left out (one already here, or not in the library) reads quieter, in the grey of an author's name, and its
   notes as they are: no fading, which would take its words below 4.5:1 against the row. */
.rv li.off .rt,.rv li.off .rv-main input{color:var(--ink2)}
/* marking what's been read: each row ticks with a tap anywhere on it, and a ticked one is tinted; a shelf's heading stays
   at the top of the sheet while its books go by */
.mr-sel{margin:0 0 12px}
.mr-sel select{font-size:16px}
.mr-shelf+.mr-shelf{margin-top:12px}
.mr .grp{top:-16px;background:var(--surface);padding:10px 2px 8px}
.mr .rv li{padding:0}
.mr-row{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;padding:11px 12px;cursor:pointer}
.mr-row input{margin-top:3px}
.mr .rv li:has(input:checked){background:var(--green-soft);border-color:var(--green)}
/* reading details from Claude */
.rv.dt{margin-top:12px}
.rv.dt li{padding:9px 12px}
#dt-opt{margin-top:8px}
.df.nw{white-space:nowrap}
.rv-by{font-size:13.5px;color:var(--ink2)}
.rv-det{font-size:13px;color:var(--ink);margin-top:2px}
.rv-blurb{font:italic 14px/1.35 var(--serif);color:var(--ink2)}
/* the tick box answers a tap anywhere along the row's left edge, not just on its own 18px */
.rv-tick{flex:none;align-self:stretch;display:flex;align-items:flex-start;margin:-9px -10px -9px -10px;padding:15px 10px 9px;cursor:pointer}
.rv-main{flex:1;min-width:0;display:grid;gap:2px}
.rv-main input{padding:3px 7px;margin-left:-8px;width:calc(100% + 8px);font-size:16px;border-color:transparent;background:transparent}
@media (hover:hover){.rv-main input:hover{border-color:var(--line2)}}
.rv-main input:focus{border-color:var(--line2);background:var(--surface)}
.rv-main .rt{font:500 17px var(--serif)}
/* The title box grows with the title as it wraps: the text, drawn unseen behind it, sets the height (no measuring). */
.rv-ti{display:grid;margin-left:-8px;width:calc(100% + 8px)}
.rv-ti>textarea.rt,.rv-ti::after{grid-area:1/1;font:500 17px/1.25 var(--serif);padding:3px 7px;border:1px solid transparent;border-radius:8px;overflow-wrap:anywhere;white-space:pre-wrap}
.rv-ti::after{content:attr(data-v) " ";visibility:hidden;pointer-events:none}
.rv-ti>textarea{margin:0;width:100%;min-height:0;resize:none;overflow:hidden;background:transparent}
@media (hover:hover){.rv-ti>textarea:hover{border-color:var(--line2)}}
.rv-ti>textarea:focus{border-color:var(--line2);background:var(--surface)}
.rv-st{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:2px 0 1px}
.rv-ed{font-size:12.5px;color:var(--ink2)}
.rv-main .rv-blurb{font-size:13.5px}
.rv-meta{font:500 11.5px var(--mono);color:var(--ink3);letter-spacing:.02em;overflow-wrap:anywhere}
.rv-flag{font-size:13px;color:var(--accent)}
.rv-dup{font-size:13px;color:var(--ink2)}
.rv-dup b{font-weight:600}
/* Move it here, under the note on a book already here: a choice pressed in or out */
.rv-mv{display:block;width:max-content;margin:6px 0 2px;padding:5px 11px;font-size:13px;line-height:18px}
.rv-mv[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.pastebox{margin-top:14px}
.pastebox textarea{font:16px/1.4 var(--mono);min-height:90px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.opt input{margin-top:2px}
.sect{padding:0 0 16px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.sect:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.sect h3{margin:0 0 6px;font:500 18px var(--serif)}
.sect p{margin:0 0 10px;color:var(--ink2)}
.sect .row{margin-top:8px}
.kv{font:500 12.5px var(--mono);color:var(--ink2)}
.sect .err{color:var(--bad);font-weight:600}
.drivepath{font:500 12.5px var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;display:inline-block;overflow-wrap:anywhere}

/* your library, in sum: each line a filter, with its share of the library as a thin brass rule under it */
.sm-top{padding-bottom:12px;border-bottom:3px double var(--rule)}
.sm-tot{margin:0;color:var(--ink2)}
.sm-big{font:500 40px/1 var(--serif);color:var(--ink);margin-right:2px}
.sm-top .note{margin:4px 0 0}
.sm-sec{margin-top:18px}
.sm-sec>.lbl{display:block;margin:0 2px 2px}
.sm-rows{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));column-gap:24px}
.sm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:10px;width:100%;min-height:44px;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px 8px;text-align:left}
.sm-l{font:500 16px/1.25 var(--serif);overflow-wrap:anywhere}
.sm-n{font:500 12.5px var(--mono);color:var(--ink2)}
.sm-bar{grid-column:1/-1;height:2px;margin-top:5px;background:var(--brass);border-radius:1px}
@media (hover:hover){.sm-row:hover .sm-l{color:var(--accent)}}
.sm-row:active{background:var(--surface2)}
.sm-sec>.note{margin:6px 2px 0}

/* what to read next */
.countrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:14px 2px 10px}
.countrow .count{margin:0}
.nextbtn{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:6px 13px;font:600 13.5px var(--sans);color:var(--accent);box-shadow:var(--shadow);white-space:nowrap}
@media (hover:hover){.nextbtn:hover{background:var(--accent-soft)}}
.nextbtn svg{width:16px;height:16px;flex:none}
.nx-crit{display:grid;gap:14px;padding-bottom:16px;margin-bottom:16px;border-bottom:3px double var(--rule)}
.nx-f{display:grid;gap:6px;justify-items:start;min-width:0}
.nx-chips{display:flex;flex-wrap:wrap;gap:6px}
.nx-sel{display:flex;gap:8px}
.nx-sel select{flex:1 1 0;padding:6px 28px 6px 12px;font-size:16px;border-radius:999px}
.nx-range{color:var(--ink2);letter-spacing:.04em}
.nx-crit .opt{padding:11px 0;margin:-11px 0}
.nx-moods{display:flex;flex-wrap:wrap;gap:6px;max-width:100%}
.nx-more{border-top:1px solid var(--line);padding-top:10px}
.nx-more:first-child{border-top:0;padding-top:0}
.nx-more>summary{cursor:pointer;font:600 14px var(--sans);color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0;margin:-12px 0}
.nx-more>summary::-webkit-details-marker{display:none}
.nx-more>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.nx-more[open]>summary::before{transform:rotate(45deg)}
.nx-morein{display:grid;gap:14px;padding-top:12px}
.nx-blurb{font:italic 15px/1.4 var(--serif);color:var(--ink2);margin-top:4px}
.nx-dl{font-size:13px;color:var(--ink);margin-top:2px}
.nx-alt .nx-w{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* on a phone the moods are one row to swipe along, edge to edge (with a mouse they wrap) */
@media (max-width:640px) and (pointer:coarse){
  .nx-f:has(.nx-moods){justify-items:stretch}
  .nx-moods{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:-3px -16px;padding:5px 24px 5px 16px;max-width:none}
  .nx-moods::-webkit-scrollbar{display:none}
}
.nx-pick{display:flex;gap:14px;align-items:flex-start;animation:deal .28s ease-out}
.nx-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nx-t{font:500 22px/1.2 var(--serif);overflow-wrap:anywhere;margin:2px 0 0;outline:none}
.nx-t .s{color:var(--ink2);font-weight:400}
.nx-done{align-self:flex-start;margin:4px 0 0 -11px}
.nx-why{margin:6px 0 6px;padding:0;list-style:none;display:grid;gap:5px}
.nx-why li{position:relative;padding-left:14px;font-size:14.5px;line-height:1.35}
.nx-why li::before{content:"";position:absolute;left:2px;top:.5em;width:5px;height:5px;border-radius:50%;background:var(--brass)}
.lb-what{margin:0 0 14px}
.lb-what li{color:var(--ink2);font-size:15px}
.nx-alts{display:grid;gap:8px;margin-top:20px;animation:deal .28s ease-out}
.nx-alts h3{margin:0}
.nx-alt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
@media (hover:hover){.nx-alt:hover{border-color:var(--ink3)}}
.nx-alt .cv{width:34px;height:50px}
.nx-alt .cv::after{top:8px;left:7px;right:5px}
.nx-alt .cv-t{font-size:13px}
.nx-alt .cv-t.wide{font-size:9.5px}
.nx-alt .bk-t{font-size:16px}
.nx-w{font-size:12.5px;color:var(--ink3);overflow-wrap:anywhere}
.nx-out>.note{margin-top:16px}
.nx-ask{display:grid;gap:8px;justify-items:start;margin-top:10px}
.nx-ask .note{margin:0}
.nx-none h3{margin:0 0 6px;font:500 20px var(--serif)}
.nx-none p{margin:0 0 10px;color:var(--ink2)}
.nx-ease{margin-bottom:10px}
@keyframes deal{from{opacity:0;transform:translateY(6px)}}

/* Share this list, after the last book */
.sharerow{display:flex;justify-content:center;margin-top:18px}
.sharerow .btn{color:var(--ink2)}

/* footer */
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;margin-top:40px;font:500 12px var(--mono);letter-spacing:.04em;color:var(--ink2)}
.foot a{color:var(--ink2);text-decoration:none}
.foot a:focus-visible{color:var(--accent);text-decoration:underline}
@media (hover:hover){.foot a:hover{color:var(--accent);text-decoration:underline}}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--ink);color:var(--ground);border-radius:11px;padding:10px 14px;font:600 14px var(--sans);display:flex;gap:14px;align-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:transform .2s,opacity .2s;z-index:60;width:max-content;max-width:calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
/* over a sheet, the toast sits just above the sheet's footer, clear of its heading and buttons (--above is how far the
   footer's top is from the bottom, set as the toast shows) */
body.locked .toast{bottom:calc(12px + var(--above,env(safe-area-inset-bottom,0px)))}
.toast button{flex:none;white-space:nowrap;background:none;border:0;color:var(--accent-soft);font-weight:700;padding:12px 10px;margin:-12px -10px;text-decoration:underline}
/* the words wrap, and the button keeps its words on one line: beside them, or on a line of its own at the right when
   it would be wider than the words beside it (What to read next on the narrowest phones; see toast()) */
#toastTx{flex:1 1 auto;min-width:0}
.toast.stack{flex-wrap:wrap}
.toast.stack #toastTx{flex-basis:100%}
.toast.stack #toastBtn{margin-left:auto}
/* a second button (Rate it) beside Undo: their tap boxes meet without overlapping, their words 20px apart */
#toastBtn2{margin-left:-4px}

@media (max-width:720px){
  html{scroll-padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .top-in{gap:6px}
  .tbtn .t{display:none}
  .tbtn{padding:8px 10px}
  .sync .t{display:inline}
  .sync[data-s="ok"] .t,.sync[data-s="busy"] .t{display:none}
  #addBtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;justify-content:center;padding:0;box-shadow:0 12px 26px -8px rgba(0,0,0,.5);z-index:30}
  #addBtn svg{width:24px;height:24px}
  .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .list{--cols:1fr}
  .frow{flex-direction:column;flex-wrap:nowrap;align-items:stretch}
  .chips{padding-right:24px}
  /* the sort menu keeps its own width; a little less padding fits "All rooms" beside it at 360px */
  .selects select{flex:1 1 0;min-width:0;max-width:none;padding-left:8px;padding-right:25px}
  #sortSel{flex:none}
}
/* On a phone the top bar's buttons are icons, but Import keeps its word whenever the sync button shows only its dot
   (sync off, or Synced) and there's room: its arrow alone looks like Download, and it's the way to Claude's links and files. */
@media (min-width:360px) and (max-width:720px){body:not(.syncword) #importBtn .t{display:inline}}
@media (max-width:359px){.top-in:has(#syncBtn[hidden]) #importBtn .t{display:inline}} /* narrower, only with sync off */
/* The search button shows once the search box has gone up under the bar. With it, the bar keeps everything on one line:
   below 375px Import is its arrow again; the logo stands in for the name where the sync button's word wouldn't fit beside
   it (Sync failed below 400px, Offline below 375px, Sync below 360px); narrower still the buttons are a little slimmer;
   and on a small laptop the search button is its magnifier. */
@media (max-width:374px){.top-in:has(#findBtn:not([hidden])) #importBtn .t{display:none}}
@media (max-width:399px){.top-in:has(#findBtn:not([hidden])):has(.sync[data-s="err"]:not([hidden])) .brand b{display:none}}
@media (max-width:374px){.top-in:has(#findBtn:not([hidden])):has(.sync[data-s="offline"]:not([hidden])) .brand b{display:none}}
@media (max-width:359px){.top-in:has(#findBtn:not([hidden])):has(.sync[data-s="tap"]:not([hidden])) .brand b{display:none}}
@media (max-width:339px){.top-in:has(#findBtn:not([hidden])) .tbtn{padding-left:9px;padding-right:9px}}
@media (min-width:721px) and (max-width:799px){#findBtn .t{display:none}}
@media (max-width:359px){
  /* "Sync failed" doesn't fit beside the name: the logo stands for it until syncing works again */
  .top-in:has(.sync[data-s="err"]:not([hidden])) .brand b{display:none}
  /* narrower still, the sort menu goes on a row of its own */
  .selects{flex-wrap:wrap}
  #sortSel{flex:1 1 100%}
}
/* Safari on an iPhone zooms the page in on a field with text under 16px, and leaves it zoomed, so there the list's menus
   keep 16px */
@supports (-webkit-touch-callout:none){.selects select{font-size:16px}}
/* on a phone the sort menu takes a row of its own when the tag menu is showing too, so a room and a tag chosen fit */
@media (max-width:400px){
  .selects:has(#tagSel:not([hidden])){flex-wrap:wrap}
  .selects:has(#tagSel:not([hidden])) #sortSel{flex:1 1 100%}
  /* a sheet's title stays on one line at 360 ("Reading details from Claude"), and wraps evenly narrower still */
  .hd h2{font-size:19px;text-wrap:balance}
}
/* "Cover to cover · Dip in and out · Browse" fits a phone on one line each with a little less padding; narrower
   still, a button's words wrap */
@media (max-width:400px){.seg button{padding:7px 10px}}
@media (max-width:340px){.seg button{white-space:normal}}
@media (max-width:420px){
  .brand b{font-size:21px}
  .brand{gap:7px}
  .loan{grid-template-columns:minmax(0,1fr) 140px}
}
@media (max-width:340px){
  .two,.loan{grid-template-columns:1fr}
}
/* On a touch screen the small controls answer a tap 44px tall: at least 44 by 44 points in Apple's Human Interface
   Guidelines (Accessibility), and 44 by 44 CSS px in WCAG 2.2 SC 2.5.5 Target Size (Enhanced), level AAA. Where a
   control is drawn smaller, an invisible box (::after, measured from inside the control's 1px border) takes the taps
   around it, never reaching a neighbour's; rows that scroll sideways keep room inside for those boxes. With a mouse
   everything is as it was. */
@media (pointer:coarse){
  .seg button{position:relative}
  .seg button::after{content:"";position:absolute;inset:-7px 0}
  .tagpicks.picks{gap:10px 6px}
  .tagpicks.picks button{position:relative;padding:8px 12px}
  .tagpicks.picks button::after{content:"";position:absolute;inset:-6px 0}
  .tagpicks:not(.picks) button{padding:6px 10px}
  .stars button{margin:0;padding:0;width:44px;height:44px}
  .checks label{min-height:44px}
  .selects select{min-height:44px}
  .chips{padding-top:10px;padding-bottom:10px;margin:-8px 0}
  .chips .chip,.nx-moods .chip{position:relative}
  .chips .chip::after,.nx-moods .chip::after{content:"";position:absolute;inset:-9px 0}
  .tbtn{position:relative}
  .tbtn::after{content:"";position:absolute;inset:-6px 0}
  .nextbtn{position:relative}
  .nextbtn::after{content:"";position:absolute;inset:-8px 0}
  /* the count's taps reach up into the space over it, and What to read next, when it's on the line below, keeps its own */
  .countrow{row-gap:16px}
  .sumbtn{position:relative}
  .sumbtn::after{content:"";position:absolute;inset:-20px -4px -8px}
  .rv-mv{position:relative}
  .rv-mv::after{content:"";position:absolute;inset:-8px 0}
  .sharerow .btn{position:relative}
  .sharerow .btn::after{content:"";position:absolute;inset:-8px 0}
  .now-acts .btn{position:relative}
  .now-acts .btn::after{content:"";position:absolute;inset:-8px 0}
  .gh>.grp{line-height:18px;padding-top:12px;padding-bottom:14px}
  .mvb{position:relative;padding:4px 12px}
  .mvb::after{content:"";position:absolute;inset:-9px 0}
}
@media (pointer:coarse){.nx-moods{row-gap:16px}#f-genres:not([hidden]){margin-bottom:2px}}
@media (pointer:coarse) and (max-width:640px){.nx-moods{padding-top:10px;padding-bottom:10px;margin:-8px -16px}}
@media (prefers-reduced-motion:reduce){.nx-more>summary::before{transition:none}.cv img,.toast,details.more>summary::before{transition:none}.sync[data-s="busy"] i,.nx-pick,.nx-alts{animation:none}
  .bk.new{animation:none;background:var(--brass-soft);border-color:var(--brass)}}
</style>

<main class="wrap">

  // ---------- moving a shelf ----------

  // ---------- marking what's been read, a shelf at a time ----------
  // The unread books, shelf by shelf, each with a tick, to stand at a bookcase and tick what's been read there. The Shelf

        (tk.length || rk.length ? '<div class="nx-sel">' + (tk.length ? select('nxTag', 'Tag', 'Any tag', tk.map(function (t) { return [t, t]; }), c.tag) : '') + (rk.length ? select('nxRoom', 'Room', 'Any room', rk.map(function (r) { return [r, r]; }), c.room) : '') + '</div>' : '') +

    setSync('ok'); $('syncTx').textContent = D.pending ? 'Saving' : 'Synced'; b.title = D.pending ? 'Saving to Google Drive' : D.last ? 'Synced with Google Drive ' + ago(D.last) : 'Synced with Google Drive';
  }
  function renderDrive() {
    var s = $('driveSect'); if (!s) return;
    // Drawn again as each sync starts and ends: the keyboard stays on its button, or goes to the sheet's heading.
    var a = document.activeElement, keep = a && s.contains(a) ? a.id || 'sheetTitle' : '';
    var g = readShared(), email = g && g.email || '';
    var html = '<h3>Sync with Google Drive</h3>';
    if (!clientId()) {
      html += '<p>Drive sync isn’t set up on this copy of Shelfmark yet. It needs a Google Cloud OAuth client ID for this address (see the <a href="https://github.com/markjf99702/shelfmark#one-time-setup">README</a>). If you have one, paste it here.</p>' +
        '<div class="isbnrow"><input id="dvCid" class="mono" placeholder="…apps.googleusercontent.com" autocomplete="off" spellcheck="false"><button class="btn" type="button" id="dvCidGo">Save</button></div>';
    } else if (!D.on) {
      html += '<p>Keep your library in your own Google Drive and the same on every device you use. Shelfmark can see only the files it makes: one folder, <span class="drivepath">Shelfmark</span>, with your library file in it. <a href="privacy.html">More on privacy</a></p>' +
        (D.err || gisErr ? '<p class="err">' + esc(D.err || gisErr) + '</p>' : '') + '<div class="row"><button class="btn primary" type="button" id="dvGo">Connect Google Drive</button></div>';
    } else {
      html += '<p>' + (syncing ? 'Syncing now…' : !hasToken() ? 'Google signs Shelfmark out after an hour. Tap <b>Sync now</b> to sign back in; your changes are safe here meanwhile.' :
        offline ? (D.last ? 'Last synced ' + esc(ago(D.last)) + '. ' : '') + 'You’re offline. Changes made here wait on this device and go to Drive when you’re back online.' : D.last ? 'Last synced ' + esc(ago(D.last)) + '.' : 'Connected.') + '</p>' +
        // Offline, Google's sign-in script can't load either, which needs no second message.
        (D.err || gisErr && !offline ? '<p class="err">' + esc(D.err || gisErr) + '</p>' : '') +
        // The account it saves to, from the email kept with the sign-in, for anyone with more than one Google account.
        '<p>Your library is in ' + (email ? '<b>' + esc(email) + '</b>’s Google Drive:' : 'your Google Drive:') + '</p><p><span class="drivepath">My Drive › Shelfmark › Shelfmark library.json</span></p>' +
        // Google Drive Help, "Check activity & file versions": a version may be deleted after 30 days or once there
        // are 100 newer ones, and Shelfmark writes the file a few seconds after each change.
        '<p>Drive keeps its earlier versions for 30 days, and only the last 100 (right-click it › File information › Manage versions).</p>' +
        '<div class="row"><button class="btn primary" type="button" id="dvSync">Sync now</button><button class="btn quiet" type="button" id="dvOff">Disconnect this device</button></div>';
    }
    s.innerHTML = html;
    // Changes not yet in Drive would be lost for good (Google's hour is up, say, a sync failed, or Drive was
    // disconnected before they got there).
    if ($('stEraseNote')) $('stEraseNote').textContent = 'Erasing removes your library' + (D.on || signedIn() ? ' and your Google sign-in' : '') + ' from this browser only' +
      (unsent() ? '. Your latest changes here haven’t reached Drive yet. ' + (D.on ? 'Tap Sync now' : 'Connect Google Drive') + ' first, or they’ll be lost.' : D.on ? ', so Drive is disconnected here. The copy in your Drive stays.' : '. Download a backup first if you want to keep it.');
    eraseLabel();
    if ($('dvCidGo')) $('dvCidGo').addEventListener('click', function () {
      var v = str($('dvCid').value, 200);
      if (!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(v)) { toast('That doesn’t look like a client ID — it ends in .apps.googleusercontent.com'); return; }
      D.clientId = v; saveDrive(); loadGis(); renderDrive();
    });
    if ($('dvGo')) $('dvGo').addEventListener('click', askToken);
    if ($('dvSync')) $('dvSync').addEventListener('click', syncNow);
    // Disconnect: changes not yet in Drive go there first while Google's sign-in is good. Otherwise they stay here,
    // marked unsent, and go to Drive when it's connected again. No revoke: that cancels Google's permission for every app
    // on the junkdrawer.works client, not just this one.
    if ($('dvOff')) $('dvOff').addEventListener('click', function () {
      if (leaving) return;
      function off() {
        var cid = D.clientId, left = D.pending; leaving = false; clearTimeout(syncT);
        D = freshDrive(); D.clientId = cid; D.pending = D.unsent = left; saveDrive(); renderSync(); renderDrive(); render();
        toast(left ? 'Drive disconnected on this device. Your latest changes haven’t reached Drive: they stay here, and go to Drive when you connect again.' : 'Drive disconnected on this device. Your library is still here and in Drive.');
      }
      if (D.pending && hasToken()) { leaving = true; sync().then(off); } else off();
    });
    if (keep) refocus($(keep) || $('sheetTitle'));
  }
  // Changes made here that haven't reached Drive: with Drive on, or left from before it was disconnected. (A device that
  // has never had Drive keeps nothing there to reach.) leaving: Disconnect is waiting for its last sync.
  function unsent() { return !!D.pending && (D.on || !!D.unsent); }
  var leaving = false;
  // Erase this device's copy, once tapped: what a second tap erases.
  function eraseLabel() {
    var b = $('stErase'); if (!b || !b.dataset.sure) return;
    b.textContent = unsent() ? 'Tap again to erase, changes not in Drive included' : 'Tap again to erase ' + plural(live(DOC).length, 'book');
  }
  function syncNow() { if (hasToken()) { D.err = ''; sync(); } else askToken(); renderDrive(); }

  // ---------- sharing the list ----------
  // Share this list gives the list on screen as plain text: on a phone (a touch screen with a share sheet) to the share
  // sheet, and elsewhere to the clipboard, saying how many books. Nothing leaves the device unless it's shared from there.
  function viewHead() {
    var chip = { unread: 'Unread', reading: 'Reading', read: 'Read', aside: 'Set aside', lent: 'Lent out', check: 'To check', wanted: 'Wishlist' }[UI.status];
    return [UI.facet && facetName(UI.facet), chip, UI.room === NOROOM ? 'No room yet' : UI.room, UI.tag ? 'Tag: ' + UI.tag : '', UI.q.trim() ? 'Search: ' + str(UI.q, 300) : ''].filter(Boolean);
  }
  function shareList(e) {
    if (!onList) return;
    var n = onList.books.length, text = listText({ head: viewHead(), lent: UI.status === 'lent', wish: UI.status === 'wanted' }, onList.books, onList.groups), btn = $('shareBtn');
    function copied() { toast('Copied ' + plural(n, 'book')); }
    function failed() { toast('Couldn’t copy the list. Try again.'); }
    // The old way, for a browser without the clipboard's own: the text selected in a box of its own, and copied.
    function oldCopy() {
      var a = document.createElement('textarea'), ok = false; a.value = text; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(a); a.select(); try { ok = document.execCommand('copy'); } catch (x) { } a.remove(); refocus(btn);
      return ok;
    }
    function copy() { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(copied, function () { if (oldCopy()) copied(); else failed(); }); else if (oldCopy()) copied(); else failed(); }
    if (navigator.share && window.matchMedia && matchMedia('(pointer: coarse)').matches) navigator.share({ text: text }).catch(function (x) { if (!x || x.name !== 'AbortError') copy(); });
    else copy();
  }
  $('shareBtn').addEventListener('click', shareList);

  // ---------- wiring ----------
  $('addBtn').addEventListener('click', function () { openNew(''); });
  $('importBtn').addEventListener('click', importSheet);
  $('nextBtn').addEventListener('click', nextSheet);
  $('sumBtn').addEventListener('click', summarySheet);
  function openSettings() { loadGis(); settingsSheet(); }
  $('setBtn').addEventListener('click', openSettings);
  $('syncBtn').addEventListener('click', function () { if (!hasToken()) askToken(); else if (D.err || offline) { D.err = ''; sync(); } else { settingsSheet(); } });
  $('list').addEventListener('click', function (e) {
    var n = e.target.closest('[data-fin],[data-aside]'); if (n) { nowDone(n.dataset.fin || n.dataset.aside, !e.detail, !n.dataset.fin); return; }
    var mv = e.target.closest('[data-mv]'); if (mv) { moveSheet(mv.dataset.mv); return; }
    var b = e.target.closest('.bk'); if (b) { bookSheet(Object.assign({}, DOC.books[b.dataset.id]), false); return; }
    var a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'add') $('addBtn').click();
    else if (a.dataset.act === 'addq') openNew(UI.q);
    else if (a.dataset.act === 'import') importSheet();
    else if (a.dataset.act === 'drive') openSettings();
    else if (a.dataset.act === 'sync') syncNow(); // signing in to Google has to happen inside the tap
    else if (a.dataset.act === 'wish') { UI.status = 'wanted'; render(); }
    else if (a.dataset.act === 'clear') { UI.q = ''; UI.status = ''; UI.room = ''; UI.tag = ''; UI.facet = ''; $('q').value = ''; render(); }
    // The search stays, and the filters go. The keyboard goes to the first book found (the button has gone).
    else if (a.dataset.act === 'all') { UI.status = ''; UI.room = ''; UI.tag = ''; UI.facet = ''; render(); var f = $('list').querySelector('.bk'); if (f && !e.detail) try { f.focus(); } catch (x) { } }
  });
  // The Read list is in the order the books were finished, once one has its day, and the Lent out list longest out first;
  // leaving them, the sort is as it was.
  $('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    // The summary's filter, taken off; from the keyboard, the keyboard goes to the first chip.
    if (c.dataset.facet) { UI.facet = ''; render(); if (!e.detail) refocus($('chips').querySelector('.chip')); return; }
    UI.status = c.dataset.s;
    if (UI.status === 'read' && (UI.sort || PREF.sort) !== 'finished' && live(DOC).some(finished)) UI.sort = 'finished';
    else if (UI.status !== 'read' && UI.sort === 'finished') UI.sort = '';
    if (UI.status === 'lent' && (UI.sort || PREF.sort) !== 'lent') UI.sort = 'lent';
    render();
  });
  $('chips').addEventListener('scroll', function () { fades(this); }, { passive: true });
  window.addEventListener('resize', function () { fades($('chips')); fades(document.querySelector('#nxCrit .nx-moods')); growTitle(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fades($('chips')); });
  var qT; $('q').addEventListener('input', function () { clearTimeout(qT); var v = this.value; qT = setTimeout(function () { UI.q = v; render(); }, 90); });
  // Enter (a phone keyboard's Search) searches at once and, on a touch screen, puts the keyboard away, so the books found
  // show. With a mouse, the keyboard stays in the box rather than falling back to the top of the page.
  $('q').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    clearTimeout(qT); if (UI.q !== this.value) { UI.q = this.value; render(); }
    if (window.matchMedia && matchMedia('(pointer: coarse)').matches) this.blur();
  });
  // On a phone the search box is too narrow for the whole placeholder, which stopped at "tags, b".
  var narrow = window.matchMedia ? matchMedia('(max-width:720px)') : null;
  function placeholder() { $('q').placeholder = narrow && narrow.matches ? 'Search your books' : 'Search titles, authors, shelves, tags, borrowers…'; }
  placeholder();
  if (narrow) { if (narrow.addEventListener) narrow.addEventListener('change', placeholder); else if (narrow.addListener) narrow.addListener(placeholder); }
  $('roomSel').addEventListener('change', function () { UI.room = this.value; render(); });
  $('tagSel').addEventListener('change', function () { UI.tag = this.value; render(); });
  $('sortSel').addEventListener('change', function () { PREF.sort = this.value; UI.sort = ''; savePrefs(); render(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('sheet').hidden) { closeSheet(); return; }
    if (e.key === 'Escape' && $('toast').contains(document.activeElement)) { hideToast(); return; }
    if (e.key === '/' && $('sheet').hidden && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName)) { e.preventDefault(); $('q').focus(); }
  });
  window.addEventListener('hashchange', checkLink);
  window.addEventListener('popstate', function () {
    var open = !$('sheet').hidden;
    if (backs) {
      // A sheet closed by a button or a key just left its entry. Should another sheet have opened since, it needs one.
      backs--;
      if (open && !sheetEntry()) pushSheet();
    } else if (open && sheetEntry() !== sheetN) shut(true);
    if (!sheetEntry()) try { history.scrollRestoration = 'auto'; } catch (e) { }
  });
  try { history.scrollRestoration = 'auto'; } catch (e) { } // as a sheet's entry left it, if the page was reloaded there
  // Another tab on this device changed the library: pick it up.
  window.addEventListener('storage', function (e) {
    if (e.key === LS) {
      try {
        if (!e.newValue) DOC = { books: {}, seen: {} };
        else { var theirs = cleanDoc(JSON.parse(e.newValue)), m = mergeDocs(DOC, theirs); DOC = m; if (canon(m) !== canon(theirs)) persist(true); }
      } catch (x) { }
      if ($('sheet').hidden) render(); else { listStale = true; changedElsewhere(); }
    }
    if (e.key === LSG) renderSync(); // signed in from another tab
    if (e.key === LSD) { try { var cid = D.clientId; D = Object.assign(freshDrive(), JSON.parse(e.newValue || '{}')); D.clientId = D.clientId || cid; } catch (x) { } renderSync(); }
  });
  // A card's typing is saved a moment after it stops; leaving the page or the app saves it straight away.
  window.addEventListener('pagehide', function () { if (cardFlush) cardFlush(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && cardFlush) cardFlush();
    if (document.visibilityState === 'visible' && D.on && hasToken()) sync();
    renderSync();
  });
  setInterval(function () { if (document.visibilityState === 'visible' && D.on && hasToken() && !syncing) sync(); else renderSync(); }, 60000);
  // Back online: what waited here goes to Drive now, not at the next minute's sync.
  window.addEventListener('online', function () { if (D.on && hasToken()) sync(); });

  // Once the search box has gone up under the top bar, a search button in the bar brings it back: the page jumps to the
  // top, with the keyboard in the box (a phone's comes up, as the tap is what puts it there).
  function drawFind() {
    var box = document.querySelector('.search'), off = !$('tools').hidden && box.getBoundingClientRect().bottom <= document.querySelector('.top').getBoundingClientRect().bottom;
    if ($('findBtn').hidden === off) $('findBtn').hidden = !off;
  }
  var findT = 0;
  window.addEventListener('scroll', function () { if (!findT) findT = requestAnimationFrame(function () { findT = 0; drawFind(); }); }, { passive: true });
  window.addEventListener('resize', drawFind);
  $('findBtn').addEventListener('click', function () { window.scrollTo(0, 0); try { $('q').focus({ preventScroll: true }); } catch (e) { $('q').focus(); } drawFind(); });

  // The top bar's height, under which the shelf headings stay (see .grp): it grows with an iPhone's notch, and with zoom.
  (function () {
    var bar = document.querySelector('.top');
    function keep() { document.documentElement.style.setProperty('--toph', bar.getBoundingClientRect().height + 'px'); }
    keep();
    if (window.ResizeObserver) new ResizeObserver(keep).observe(bar); else window.addEventListener('resize', keep);
  })();
  render();
  if (D.on && clientId()) { loadGis(); if (hasToken()) sync(); }
  renderSync();
  checkLink();
})();</script>
